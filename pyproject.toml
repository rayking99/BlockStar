[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "blockstar-planner"
version = "0.2.0"
description = "Automatic geometric block rearrangement with reproducible discovery and strict replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6,<3", "numpy>=2,<3"]
dev = ["ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
blockstar = "blockstar.cli:main"
agentformer = "blockstar.learning:main"

[tool.hatch.build.targets.wheel]
packages = ["blockstar"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
